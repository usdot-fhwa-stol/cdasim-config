services:
  cdasim:
    image: "${CDASIM_IMAGE}"
    container_name: cdasim
    privileged: true
    networks:
      - carma_sim_net
    environment:
      DISPLAY: "${DISPLAY}"
      QT_X11_NO_MITSHM: "1"
      MOSAIC_DOCKER_NETWORK: "container:cdasim"
      CARLA_RENDER_OFFSCREEN: "${CARLA_RENDER_OFFSCREEN:-true}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility,compute
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/carma-simulation/tmp:/opt/carma-simulation/tmp
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - "${CDASIM_LOG_ROOT}:/opt/carma-simulation/logs"
    group_add:
      - "${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID must be set by Scenario Runner}"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    command: bash -c "./mosaic.sh -s ${MOSAIC_SCENARIO}"

  carla-sensor-lib:
    image: "${CARLA_SENSOR_LIB_IMAGE}"
    container_name: carla-sensor-lib
    restart: always
    networks:
      - carma_sim_net
    volumes:
      - "${CDASIM_LOG_ROOT}/carla-sensor-lib:/home/CarlaCDASimAdapter/logs"
    command: >-
      bash -c "sleep 8;
      python3 -u /home/CarlaCDASimAdapter/src/CarlaCDASimAdapter.py
      --carla-host carla-server
      --xmlrpc-server-host 0.0.0.0
      --xmlrpc-server-port 8091"

  xml-rpc-server:
    image: "${XML_RPC_SERVER_IMAGE:-usdotfhwastoldev/xml-rpc-server:develop}"
    container_name: xml-rpc-server
    networks:
      - carma_sim_net
    command:
      - python3.10
      - /home/carma/src/carla_v0.10_xmlrpc_server.py
      - --debug
      - --carla-host=carla-server
      - "--host=0.0.0.0"

networks:
  carma_sim_net:
    external: true
    name: "${SIM_NETWORK_NAME}"
